# "Ivied Walls" book data — shared by the homepage teaser and the dedicated book page.
title: "Ivied Walls"
kind: "Poetry"
poem_count: 23
tagline: >-
  Ivied Walls is not just poetry, it's a state of being. An arc of being concrete, of weathering,
  and finally letting the ivy through the cracks.
blurb: >-
  A debut collection that lingers in the subtle details of living — memory, loss, longing, and
  revelation — turning the ordinary unfamiliar, and the unfamiliar ordinary, while exploring the
  quieter corners of the human mind.
author_note: >-
  Janhavi discovered poetry through her father and has written throughout her life, moving through
  slice-of-life narratives and the emotional landscape of memory and longing. Some of her poems have
  appeared on Substack; <em>Ivied Walls</em> is her debut published collection.
