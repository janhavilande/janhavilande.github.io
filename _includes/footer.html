<footer class="site-footer">
    <svg class="grass-strip" viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true">
        <defs>
            <pattern id="grassTile" width="16" height="34" patternUnits="userSpaceOnUse">
                <path d="M0 34 L1.5 20 L3 34 M5 34 L7 14 L9 34 M11 34 L12.5 22 L14 34" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            </pattern>
        </defs>
        <rect x="0" y="0" width="200" height="34" fill="url(#grassTile)"></rect>
    </svg>
    <div class="container-lg">
        <div class="footer-row">
            <div class="footer-text">
                <i>Last updated {{ "now" | date: "%B %Y" }}</i>
            </div>
            <div class="footer-text right">
                &copy; {{ "now" | date: "%Y" }} {{ site.data.display.footer_name }}
            </div>
        </div>
    </div>
</footer>
