<footer class="site-footer">
    <div class="container-lg">
        <button type="button" class="easter-egg footer-mark" aria-expanded="false" aria-controls="footer-egg-note">&#10022;</button>
        <p class="easter-note" id="footer-egg-note" style="margin: -0.4rem auto 0.9rem;">Curiosity is a valid research methodology.</p>
        <div class="footer-row">
            <div class="footer-text">
                Last updated {{ "now" | date: "%B %Y" }}
            </div>
            <div class="footer-text right">
                &copy; {{ "now" | date: "%Y" }} {{ site.data.display.footer_name }}
            </div>
        </div>
    </div>
</footer>
